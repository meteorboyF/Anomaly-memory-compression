# PROVISIONAL (Phase 1). Blocked by gate + allocation. Values to be frozen from the
# official PatchCore code/paper before the first accelerator run.
tool: extract_features
schema_version: 1
extracted_dirname: mvtec_ad
categories: [bottle, cable, capsule, carpet, grid, hazelnut, leather, metal_nut, pill, screw, tile, toothbrush, transistor, wood, zipper]
backbone: wide_resnet50_2
weights_source: torchvision IMAGENET1K_V1   # weights only; no ImageNet images are downloaded
layers: [layer2, layer3]
geometry:
  # PatchCore official preprocessing (datasets/mvtec.py): Resize(256) -> CenterCrop(224) for image AND
  # mask; torchvision bilinear on the PIL mask, then .astype(int) floors partial pixels -> only fully
  # covered pixels stay anomalous (threshold 0.999 reproduces the floor of k/255).
  name: patchcore_repro_r256_c224
  resize: 256
  crop: 224
  image_interp: bilinear
  mask_interp: bilinear
  mask_threshold: 0.999
precision: fp32
batch_size: 8
chunk_images: 64
est_gpu_hours: 0.5
