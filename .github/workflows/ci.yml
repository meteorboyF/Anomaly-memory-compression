name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Repository safeguards (secrets, data, blobs, notebook outputs)
        run: python tools/precommit_check.py --all
      - name: Notebook is generated and output-free
        run: python tools/build_notebook.py --check
      - name: Tests (CPU, no dataset)
        run: python -m pytest -q
